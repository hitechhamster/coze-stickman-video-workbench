        llmParam:
            - name: temperature
              input:
                type: float
                value: "0.3"
            - name: maxTokens
              input:
                type: integer
                value: "12288"
            - name: spCurrentTime
              input:
                type: boolean
                value: false
            - name: spAntiLeak
