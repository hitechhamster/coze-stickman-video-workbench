                      "video_prompt": "5-second scene: Subject maintaining listening posture, occasionally nodding gently, Supporting character gesturing while speaking, body swaying rhythmically, Camera stays still, Warm smooth transition"
                    }

                    Example 4: Psychological Growth Process
                    Input

                    json
                    {
                      "content": "Stepping out of your comfort zone feels uncomfortable, but it's the beginning of growth"
                    }

                    Output

                    json
                    {
                      "img_prompt": "Abstract scene, black line stick figure standing at the edge of circular area on left side of frame, one foot already stepping out. Expression slightly nervous but determined, posture stepping forward, hands slightly open for balance. Left circular area filled with light gray representing COMFORT ZONE with text label, right open space in mint green representing GROWTH ZONE. No supporting characters, using area contrast to express concept. Background fresh light green base, vibrant feeling, large white space on right. Color palette light green, light gray, black, composition subject on left at transition point, right side white space over 50% symbolizing possibilities. Clean hand-drawn stick figure illustration, stick figure composed of uniform black lines, large head small body, eyes are solid small black dots or hollow circles, simple curved lines for expressions, body has no fill and is clean and simple, soft watercolor texture, smooth natural brush strokes, clean rounded edges, fresh and bright colors, high contrast and easy to read, light paper texture, moderate white space, educational illustration style, no complex details or realistic elements",
